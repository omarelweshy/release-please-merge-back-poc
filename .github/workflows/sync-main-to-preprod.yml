name: sync main -> preprod

# Step 6 of the flow. Fires whenever main moves -- a merged release PR, or a
# hotfix landing directly. Both need to travel back down.
#
# No loop guard is needed: this writes to `preprod`, never to `main`.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-main-to-preprod
  cancel-in-progress: false

permissions:
  # The reusable workflow pushes the sync branch and opens a PR.
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: ./.github/workflows/sync.yml
    with:
      source: main
      target: preprod
      sync_branch: sync/main-to-preprod
    secrets:
      # Falls back to GITHUB_TOKEN so this works before SYNC_TOKEN exists; an
      # unset secret is an empty string, not a missing input, so without the
      # fallback checkout fails outright. See the header note for what the PAT
      # buys you.
      token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
