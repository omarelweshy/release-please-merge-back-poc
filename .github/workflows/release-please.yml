name: release-please

# Step 4 of the flow. Runs on main only. Builds CHANGELOG.md and the version
# bump from the conventional-commit messages that arrived on main.
#
# The input it reads is the one squash commit per feature created at
# `feature -> test`. Every merge above that point is a merge commit, so those
# individual commits survive all the way to main intact. If anyone squashes a
# `test -> preprod` or `preprod -> main` PR, main gets a single commit titled
# something like "Merge test into preprod (#412)" and this produces nothing
# useful. That is the load-bearing rule of the whole setup.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  # release-please commits the changelog/version bump and opens the release PR.
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # `release_created` is the per-release flag. Compare it against the string
      # 'true': GitHub casts the non-empty string "false" to truthy in `if:`,
      # so a bare truthiness test deploys on every run.
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      # Set when the fallback below had to cut the release itself.
      fallback_created: ${{ steps.ensure.outputs.created }}
      fallback_tag: ${{ steps.ensure.outputs.tag }}
      fallback_version: ${{ steps.ensure.outputs.version }}
    steps:
      # Needed by the fallback, which reads version.txt and CHANGELOG.md.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Prefer the PAT so checks run on the release PR: a PR opened with
          # GITHUB_TOKEN gets no workflow runs, so it shows an empty check list
          # and cannot satisfy required checks.
          #
          # Falls back to GITHUB_TOKEN so the workflow still works before
          # SYNC_TOKEN exists. Without the fallback an unset secret resolves to
          # an empty string and the action fails with
          # "Input required and not supplied: token".
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please is supposed to cut the GitHub release, and therefore the
      # tag, on the run after the release PR merges. In this repository it did
      # not: run #7 processed the merge of the v0.2.0 release PR, exited
      # successfully, and created no tag and no release, leaving PR #6 merged
      # and still labelled `autorelease: pending`. While a merged release PR is
      # pending, release-please will not open the next one either -- so the
      # whole release process stops dead, silently, with green runs.
      #
      # This cuts the release itself when that state is detected. It is
      # idempotent: if the tag already exists it does nothing, so on a healthy
      # run where release-please did its job this is a no-op.
      - name: Cut the release if release-please left one pending
        id: ensure
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "created=false" >> "$GITHUB_OUTPUT"

          VERSION=$(tr -d "[:space:]" < version.txt)
          TAG="v$VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          PENDING=$(gh pr list --state merged --base "${GITHUB_REF_NAME}" \
                      --label "autorelease: pending" --limit 1 \
                      --json number,mergeCommit \
                      --jq '.[0] | select(. != null) | "\(.number) \(.mergeCommit.oid)"' \
                    2>/dev/null || echo "")

          if [ -z "$PENDING" ]; then
            echo "No merged release PR is waiting to be tagged."
            exit 0
          fi

          NUM="${PENDING%% *}"
          SHA="${PENDING##* }"
          echo "::warning::release-please left PR #$NUM merged and untagged. Cutting $TAG at ${SHA:0:8}."

          # Release notes = the top section of the changelog, i.e. this version.
          NOTES=$(mktemp)
          awk '/^## /{ if (seen) exit; seen=1 } seen' CHANGELOG.md > "$NOTES" || true
          [ -s "$NOTES" ] || echo "Release $TAG" > "$NOTES"

          gh release create "$TAG" --target "$SHA" --title "$TAG" --notes-file "$NOTES"

          gh label create "autorelease: tagged" --color ededed --force >/dev/null 2>&1 || true
          gh pr edit "$NUM" --remove-label "autorelease: pending" \
                            --add-label "autorelease: tagged" >/dev/null 2>&1 \
            || echo "::warning::Cut $TAG but could not relabel PR #$NUM; release-please may stall again."

          {
            echo "created=true"
            echo "tag=$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      # release-please cuts the GitHub release -- and therefore the tag -- on the
      # run *after* the release PR merges, by finding the merged PR labelled
      # `autorelease: pending`. If that label was never applied (a token without
      # permission to label, say) it finds nothing, creates nothing, and exits
      # zero. The workflow goes green and no tag appears.
      #
      # That silence is the problem: the deploy job below is gated on
      # release_created, so a missing tag means production quietly never ships.
      # Fail loudly instead.
      - name: Confirm the tag was actually created
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .ref > /dev/null 2>&1; then
            echo "Tag $TAG exists on the remote."
          else
            echo "::error::release-please reported release_created=true but tag $TAG is not on the remote."
            echo "::error::The production deploy is gated on this, so nothing will ship."
            exit 1
          fi

      - name: Summary
        env:
          CREATED: ${{ steps.release.outputs.release_created }}
          TAG: ${{ steps.release.outputs.tag_name }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          if [ "$CREATED" = "true" ]; then
            echo "Released **$TAG**. Production deploy follows." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$PR" ]; then
            echo "Release PR opened or updated. Merge it to cut the release." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "No release cut on this run."
              echo ""
              echo "Expected if this push carried no \`feat:\` or \`fix:\` commits."
              echo "If a release PR was just merged and you expected a tag, check that"
              echo "the merged PR carried the \`autorelease: pending\` label -- without"
              echo "it release-please cannot find the release to cut."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Deploys ONLY on the run where a version was actually cut -- that is, when
  # the release PR merged. A plain promotion merge to `main` sets
  # release_created to false and this is skipped, so production is never
  # deployed from an untagged commit.
  #
  # Called rather than triggered: a release or tag created with GITHUB_TOKEN
  # does not trigger another workflow, so an `on: release` deploy would never
  # fire. Same job graph, no recursion guard to fight.
  deploy-production:
    needs: release-please
    # Either path counts: release-please cut it, or the fallback did.
    if: >-
      ${{ needs.release-please.outputs.release_created == 'true'
          || needs.release-please.outputs.fallback_created == 'true' }}
    uses: ./.github/workflows/deploy-production.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name || needs.release-please.outputs.fallback_tag }}
      version: ${{ needs.release-please.outputs.version || needs.release-please.outputs.fallback_version }}
