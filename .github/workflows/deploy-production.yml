name: Deploy to production

# MOCK. Every deploy step is an echo; nothing leaves the runner.
#
# Push to `main` only. The PR-time preview lives in its own file,
# deploy-production-preview.yml, and that separation is deliberate: a job
# skipped by a job-level `if:` still reports a `skipped` check on the PR, so
# keeping both jobs in one workflow put a permanently-skipped "Deploy" entry on
# every pull request. The condition belongs in `on:`, not in `if:`.
#
# A note for when this stops being a mock: menu's release-please.yml dispatches
# its deploy inline, gated on `steps.release.outputs.release_created == 'true'`,
# so it deploys the commit that was actually tagged. Hanging this off a bare
# push to `main` instead -- as it is here -- means it fires on the promotion
# merge AND again on the release PR merge, and the first of those deploys a
# commit with no tag and no changelog. For the real repo, move this job into
# release-please.yml behind that same `release_created` gate. It is left on
# `push` here so the POC can demonstrate the trigger without cutting releases.

on:
  push:
    branches: [main]

concurrency:
  # Never let two production deploys overlap. `cancel-in-progress: false`
  # because killing a half-finished deploy is worse than queueing behind it.
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Uncomment once a GitHub Environment exists. It is what gives production a
    # required-reviewer gate and a deployment record, rather than relying on
    # nobody having pushed the wrong button.
    # environment:
    #   name: production
    #   url: https://example.invalid
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release under deploy
        id: rel
        run: |
          set -euo pipefail
          VERSION=$(cat version.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # A tag pointing at this exact commit means release-please cut it.
          # Anything else is an untagged promotion merge -- see the header note.
          if TAG=$(git describe --exact-match --tags HEAD 2>/dev/null); then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "Deploying tagged release $TAG (version $VERSION)."
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "::warning::HEAD carries no tag. This is an untagged commit on main, not a cut release."
          fi

      - name: Build artifact
        run: |
          echo "MOCK: composer install --no-dev --optimize-autoloader"
          echo "MOCK: php artisan config:cache && php artisan route:cache"

      - name: Deploy
        run: |
          echo "MOCK: shipping ${{ steps.rel.outputs.version }} (${GITHUB_SHA:0:8}) to production"
          echo "MOCK: php artisan migrate --force"
          echo "MOCK: php artisan queue:restart"

      - name: Record
        run: |
          {
            echo "### Production deploy — APPLIED (mock)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${{ steps.rel.outputs.version }}\` |"
            echo "| Tag | \`${{ steps.rel.outputs.tag || 'none — untagged commit' }}\` |"
            echo "| Commit | \`${GITHUB_SHA:0:8}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
