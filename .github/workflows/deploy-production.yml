name: Deploy to production

# MOCK. Every deploy step is an echo; nothing leaves the runner.
#
# This does NOT listen for pushes to `main`. It used to, and that was wrong:
# `main` is pushed twice per release -- once when the promotion merges, and
# again when the release PR merges -- so production was deployed from an
# untagged commit before the version bump and changelog even existed.
#
# Instead release-please.yml calls this, gated on
# `release_created == 'true'`, which is only true on the run where a version
# was actually cut. One release, one deploy, of the commit that carries the tag.
#
# Why called rather than triggered on `release`/tag push: a release or tag
# created with GITHUB_TOKEN does not trigger another workflow (GitHub's
# anti-recursion guard), so a `on: release` workflow would simply never fire.
# Running in the same job graph sidesteps that entirely. menu's
# release-please.yml does the same thing for the same reason.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag being deployed, e.g. v0.2.0
        required: true
        type: string
      version:
        description: Version being deployed, e.g. 0.2.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to deploy, e.g. v0.2.0. Leave blank to deploy the current tip of main.
        required: false
        type: string

concurrency:
  # Never let two production deploys overlap. `cancel-in-progress: false`
  # because killing a half-finished deploy is worse than queueing behind it.
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Named for the environment. A job called just "Deploy" shows on a pull
    # request as a bare "Deploy" check, and every deploy workflow then looks
    # like the production one.
    name: Deploy production
    runs-on: ubuntu-latest
    # Uncomment once a GitHub Environment exists. It is what gives production a
    # required-reviewer gate and a deployment record, rather than relying on
    # nobody having pushed the wrong button.
    # environment:
    #   name: production
    #   url: https://example.invalid
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy the tag, not whatever main happens to be now. On a manual
          # run with no tag given this is empty and checkout takes the default.
          ref: ${{ inputs.tag }}

      - name: Resolve what is being deployed
        id: rel
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          VERSION="${{ inputs.version }}"
          [ -n "$VERSION" ] || VERSION=$(cat version.txt)

          if [ -z "$TAG" ]; then
            echo "::warning::No tag supplied. Deploying the current tip of main, which is not a cut release."
            TAG="(untagged)"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying $TAG (version $VERSION) at $(git rev-parse --short HEAD)."

      - name: Build artifact
        run: |
          echo "MOCK: composer install --no-dev --optimize-autoloader"
          echo "MOCK: php artisan config:cache && php artisan route:cache"

      - name: Deploy
        run: |
          echo "MOCK: shipping ${{ steps.rel.outputs.version }} (${{ steps.rel.outputs.tag }}) to production"
          echo "MOCK: php artisan migrate --force"
          echo "MOCK: php artisan queue:restart"

      - name: Record
        run: |
          {
            echo "### Production deploy — APPLIED (mock)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${{ steps.rel.outputs.version }}\` |"
            echo "| Tag | \`${{ steps.rel.outputs.tag }}\` |"
            echo "| Commit | \`${GITHUB_SHA:0:8}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
